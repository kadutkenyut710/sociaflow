name: Extract SociaFlow source
on:
  push:
    branches: [main]
    paths:
      - "source_bundle.zip"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract verified source archive
        run: |
          set -euo pipefail
          unzip -t source_bundle.zip
          mkdir -p /tmp/sociaflow
          unzip -q source_bundle.zip -d /tmp/sociaflow
          cp -a /tmp/sociaflow/SociaFlow/. .
          rm source_bundle.zip
          printf '\n# Local files\n.env\n.env.*\n!.env.example\n.venv/\n__pycache__/\n*.pyc\n' >> .gitignore
      - name: Commit app source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Import SociaFlow website and backend'
            git push
          fi
